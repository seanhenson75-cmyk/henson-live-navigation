<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Henson Live Navigation</title>
<!-- deployment refresh: heading-up navigation -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
<style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}body{background:#071019}.brand{position:absolute;z-index:5;top:8px;left:50%;transform:translateX(-50%);background:#050607e8;color:#fff;border-radius:12px;padding:6px 14px;text-align:center;pointer-events:none}.brand b{letter-spacing:3px}.brand small{display:block;color:#ffc400;letter-spacing:3px;font-size:9px;font-weight:700}.search{position:absolute;z-index:5;top:52px;left:10px;right:10px;display:flex;gap:6px}.search input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;font-size:16px;box-shadow:0 2px 8px #0005}.search button,.center{border:0;border-radius:10px;background:#12a84a;color:#fff;font-weight:800;padding:0 15px}.town{position:absolute;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);background:#071019e8;color:#fff;border:1px solid #ffffff30;border-radius:18px;padding:7px 13px;font-weight:700;white-space:nowrap}.center{position:absolute;z-index:5;right:12px;bottom:22px;width:48px;height:48px;padding:0;border-radius:50%;font-size:20px}.car{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:28px solid #1677ff;filter:drop-shadow(0 2px 2px #000);transform:translate(-12px,-14px)}.msg{position:absolute;z-index:6;top:100px;left:10px;background:#071019e8;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;max-width:240px}</style></head>
<body><div id="map"></div><div class="brand"><b>HENSON</b><small>LIVE NAVIGATION</small></div>
<form class="search" id="search"><input id="q" placeholder="Where to?"><button>GO</button></form>
<div class="town" id="town">Waiting for GPS…</div><button class="center" id="center">◎</button><div class="msg" id="msg">Allow precise location. Once moving, your direction stays UP.</div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-82.01,34.5],zoom:11,pitch:45,attributionControl:true});
let marker,last=null,heading=0,follow=true,lastTownAt=0;
function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r;return(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/r+360)%360}
function smooth(a,b){let d=((b-a+540)%360)-180;return(a+d*.28+360)%360}
function updateTown(lat,lng){if(Date.now()-lastTownAt<12000)return;lastTownAt=Date.now();fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat='+lat+'&lon='+lng).then(r=>r.json()).then(x=>{let a=x.address||{};document.getElementById('town').textContent=a.city||a.town||a.village||a.hamlet||a.county||'Current location'}).catch(()=>{})}
function gps(p){let c=p.coords,cur={lat:c.latitude,lng:c.longitude};let h=Number.isFinite(c.heading)?c.heading:null;if(h==null&&last&&c.speed!==0)h=bearing(last,cur);if(h!=null&&(c.speed==null||c.speed>.7))heading=smooth(heading,h);last=cur;if(!marker)marker=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'car'}),rotationAlignment:'viewport'}).setLngLat([cur.lng,cur.lat]).addTo(map);else marker.setLngLat([cur.lng,cur.lat]);if(follow)map.easeTo({center:[cur.lng,cur.lat],bearing:heading,pitch:50,zoom:Math.max(map.getZoom(),16),duration:700,essential:true});document.getElementById('msg').style.display='none';updateTown(cur.lat,cur.lng)}
function err(e){document.getElementById('msg').textContent='GPS permission needed: '+e.message}
navigator.geolocation&&navigator.geolocation.watchPosition(gps,err,{enableHighAccuracy:true,maximumAge:500,timeout:10000});
map.on('dragstart',()=>follow=false);document.getElementById('center').onclick=()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16})};
document.getElementById('search').onsubmit=async e=>{e.preventDefault();let q=document.getElementById('q').value.trim();if(!q)return;let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q)),j=await r.json();if(j[0]){follow=false;map.flyTo({center:[+j[0].lon,+j[0].lat],zoom:15,bearing:0,pitch:0})}};
</script></body></html>
