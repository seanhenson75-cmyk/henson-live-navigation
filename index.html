// Frame-based marker movement: GPS fixes set a target; rendering runs independently.
let smoothTarget=null,lastGpsAt=0,lastFrameAt=0,renderHeading=0;
function animateVehicle(now){
  requestAnimationFrame(animateVehicle);
  if(!marker||!displayPos||!smoothTarget)return;
  const dt=lastFrameAt?Math.min(0.1,(now-lastFrameAt)/1000):0.016;
  lastFrameAt=now;
  const remaining=distM(displayPos,smoothTarget);
  // Do not chase wildly inaccurate fixes; ease toward the latest validated fix.
  const alpha=1-Math.exp(-dt/0.42);
  if(remaining>0.08){
    displayPos.lat+=(smoothTarget.lat-displayPos.lat)*alpha;
    displayPos.lng+=(smoothTarget.lng-displayPos.lng)*alpha;
  }else Object.assign(displayPos,smoothTarget);
  marker.setLngLat([displayPos.lng,displayPos.lat]);
  const delta=((heading-renderHeading+540)%360)-180;
  renderHeading=(renderHeading+delta*(1-Math.exp(-dt/0.28))+360)%360;
  // Limit map camera work to ~30 FPS; avoid competing easeTo animations.
  if(follow&&now-(animateVehicle.lastCamera||0)>32){
    animateVehicle.lastCamera=now;
    map.jumpTo({center:[displayPos.lng,displayPos.lat],bearing:renderHeading,pitch:50,zoom:Math.max(map.getZoom(),16)});
  }
}
