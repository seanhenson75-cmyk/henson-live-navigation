<body><div id="map"></div><label class="theme">☾ <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><div class="brand"><b>HENSON</b><small>LIVE NAVIGATION</small></div>

<div class="speed"><b id="mph">--</b><small>MPH</small></div><button class="voicetest" id="voicetest">TEST VOICE</button><div class="navtools"><button class="routeopts" id="routeopts">⚙ Route</button><button class="stopnav" id="stopnav">STOP</button></div><div class="prefs" id="prefs"><label><input type="checkbox" id="avoidTolls">Avoid toll roads</label><label><input type="checkbox" id="avoidHighways">Avoid highways</label><label><input type="checkbox" id="avoidFerries">Avoid ferries</label></div><div class="trip" id="trip"><span id="miles">-- mi</span><span id="eta">-- min</span></div><div class="town" id="town">Waiting for GPS…</div><button class="center" id="center">◎</button><div class="msg" id="msg">Tap here to start GPS</div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const themeSelect=document.getElementById('theme');
function applyTheme(v){localStorage.setItem('nav-theme',v);const dark=v==='dark'||(v==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('light',!dark);document.body.classList.toggle('dark',dark);if(!window.map)return;const style=dark?{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'osm-dark',type:'raster',source:'osm',paint:{'raster-brightness-max':0.42,'raster-contrast':0.25,'raster-saturation':-0.7}}]}:'https://tiles.openfreemap.org/styles/liberty';try{map.setStyle(style)}catch(e){console.error('theme',e)}}
themeSelect.value=localStorage.getItem('nav-theme')||'auto';themeSelect.onchange=()=>applyTheme(themeSelect.value);matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themeSelect.value==='auto')applyTheme('auto')});
const map=new maplibregl.Map({container:'map',style:window._pendingMapStyle||'https://tiles.openfreemap.org/styles/liberty',center:[-82.01,34.5],zoom:11,pitch:45,attributionControl:true});
window.map=map;map.on('load',()=>applyTheme(themeSelect.value));let marker,last=null,displayPos=null,heading=0,follow=true,lastTownAt=0,routeDest=null,routeSteps=[],stepIndex=0,currentStreet='',currentPlace='',driving=false,slowSince=0,lastVoiceStep=-1,currentSpeedLimit=0,lastSpeedCheck=0,speedWarned=false,routeTotalDistance=0,routeTotalDuration=0,routeStart=null;const wifeVoice={left:new Audio('voice/turn-left.mp3'),right:new Audio('voice/turn-right.mp3'),keepLeft:new Audio('voice/keep-left.mp3'),keepRight:new Audio('voice/keep-right.mp3'),straight:new Audio('voice/continue-straight.mp3'),exit:new Audio('voice/take-exit.mp3'),uturn:new Audio('voice/make-u-turn.mp3'),arrived:new Audio('voice/arrived.mp3'),recalc:new Audio('voice/recalculating.mp3'),slow:new Audio('voice/sean-slow-down.mp3'),fast:new Audio('voice/sean-too-fast.mp3'),baby:new Audio('voice/baby-slow-down.mp3')};function playWife(k){const a=wifeVoice[k];if(!a)return;try{speechSynthesis.cancel();a.muted=false;a.volume=1;a.pause();a.currentTime=0;setTimeout(()=>{a.play().catch(err=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Wife audio blocked: '+err.name})},600)}catch(e){}}const voiceKeys=['left','right','keepLeft','keepRight','straight','uturn','exit','arrived','recalc','slow','fast','baby'];let wifeAudioUnlocked=false;async function unlockWifeAudio(){if(wifeAudioUnlocked)return;try{for(const a of Object.values(wifeVoice)){a.preload='auto';a.load()}const a=wifeVoice.left;a.muted=false;a.volume=1;a.currentTime=0;await a.play();a.pause();a.currentTime=0;wifeAudioUnlocked=true}catch(e){const m=document.getElementById('msg');m.style.display='block';m.textContent='Tap TEST VOICE once to enable wife audio'}}let testIdx=0;document.getElementById('voicetest').onclick=()=>{playWife(voiceKeys[testIdx]);testIdx=(testIdx+1)%voiceKeys.length};function speakDistance(step){if(!step||!('speechSynthesis'in window))return;const ft=Math.max(0,Math.round(step.distance*3.28084));let phrase='';if(ft>=5280)phrase='In '+Math.max(1,Math.round(ft/5280))+' miles';else if(ft>=1000)phrase='In '+Math.round(ft/100)*100+' feet';else if(ft>=200)phrase='In '+Math.round(ft/50)*50+' feet';if(!phrase)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrase);speechSynthesis.speak(u)}catch(e){}}
async function updateSpeedLimit(lat,lng){if(Date.now()-lastSpeedCheck<5000)return;lastSpeedCheck=Date.now();try{const req={shape:[{lat,lon:lng}],costing:'auto',shape_match:'map_snap',filters:{action:'include',attributes:['edge.speed_limit','matched.edge_index']},directions_options:{units:'miles'}};const r=await fetch('https://valhalla1.openstreetmap.de/trace_attributes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});if(!r.ok)return;const j=await r.json();const e=j.edges?.[j.matched_points?.[0]?.edge_index??0];const lim=Number(e?.speed_limit);currentSpeedLimit=Number.isFinite(lim)&&lim>0&&lim<150?lim:0}catch(e){currentSpeedLimit=0}}function speedWarning(mph){if(!currentSpeedLimit||mph<currentSpeedLimit+7){speedWarned=false;return}if(speedWarned)return;speedWarned=true;playWife('slow');setTimeout(()=>{if(last&&currentSpeedLimit&&Number(document.getElementById('mph').textContent)>=currentSpeedLimit+12)playWife('fast')},5000)}function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r;return(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/r+360)%360}
function smooth(a,b){let d=((b-a+540)%360)-180;return(a+d*.28+360)%360}
function renderLocation(){const el=document.getElementById('town');el.textContent=currentPlace||currentStreet||'Location found'}async function updateTown(lat,lng){if(Date.now()-lastTownAt<5000)return;lastTownAt=Date.now();try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+lat+'&lon='+lng+'&accept-language=en');if(!r.ok)throw new Error('reverse geocode '+r.status);const x=await r.json(),a=x.address||{};currentStreet=[a.house_number,a.road||a.street||a.pedestrian].filter(Boolean).join(' ');currentPlace=a.city||a.town||a.village||a.hamlet||a.locality||a.suburb||a.neighbourhood||'';renderLocation()}catch(e){renderLocation()}}
function distM(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lng-a.lng)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function updateTripProgress(cur,mphNow){if(!routeDest||!routeTotalDistance)return;const directRemain=distM(cur,routeDest),directStart=routeStart?distM(routeStart,routeDest):routeTotalDistance;let ratio=directStart>1?Math.min(1,Math.max(0,directRemain/directStart)):0;let remain=Math.max(directRemain,routeTotalDistance*ratio);if(routeSteps.length){let stepRemain=0;for(let i=stepIndex;i<routeSteps.length;i++)stepRemain+=Number(routeSteps[i].distance)||0;if(stepRemain>0)remain=Math.max(directRemain,stepRemain)}const miles=remain/1609.344;document.getElementById('miles').textContent=miles.toFixed(miles<10?1:0)+' mi';let mins;if(mphNow>5)mins=Math.ceil((remain/1609.344)/mphNow*60);else mins=Math.ceil((routeTotalDuration*ratio)/60);if(Number.isFinite(mins))document.getElementById('eta').textContent=Math.max(1,mins)+' min'}
function wifeKeyForStep(s){const ins=(s?.maneuver?.instruction||s?.name||'').toLowerCase(),type=(s?.maneuver?.type||'').toLowerCase(),mod=(s?.maneuver?.modifier||'').toLowerCase();if(ins.includes('keep left')||type==='fork'&&mod.includes('left'))return'keepLeft';if(ins.includes('keep right')||type==='fork'&&mod.includes('right'))return'keepRight';if(ins.includes('u-turn')||ins.includes('uturn')||mod.includes('uturn'))return'uturn';if(ins.includes('exit')||type.includes('off ramp')||type.includes('exit'))return'exit';if(ins.includes('arriv')||ins.includes('destination')||type==='arrive')return'arrived';if(ins.includes('left')||mod.includes('left'))return'left';if(ins.includes('right')||mod.includes('right'))return'right';if(ins.includes('straight')||ins.includes('continue')||mod==='straight'||type==='depart'||type==='continue')return'straight';return'straight'}
function showStep(){if(!routeSteps.length)return;const s=routeSteps[Math.min(stepIndex,routeSteps.length-1)];if(stepIndex!==lastVoiceStep){lastVoiceStep=stepIndex;const wk=wifeKeyForStep(s);const sayWife=()=>playWife(wk);if('speechSynthesis'in window){speechSynthesis.cancel();const ft=Math.max(0,Math.round(s.distance*3.28084));let phrase=ft>=5280?'In '+Math.max(1,Math.round(ft/5280))+' miles':ft>=1000?'In '+Math.round(ft/100)*100+' feet':ft>=200?'In '+Math.round(ft/50)*50+' feet':'';if(phrase){const u=new SpeechSynthesisUtterance(phrase);let fired=false;const finish=()=>{if(fired)return;fired=true;speechSynthesis.cancel();setTimeout(sayWife,600)};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,4500)}else sayWife()}else sayWife()}const d=Math.max(0,Math.round(s.distance*3.28084));document.getElementById('msg').style.display='block';document.getElementById('msg').textContent=(s.maneuver?.instruction||'Continue')+' • '+(d>=528?Math.round(d/528)/10+' mi':d+' ft')}
function decodePolyline6(str){let i=0,lat=0,lng=0,out=[];while(i<str.length){let b,shift=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(res&1)?~(res>>1):(res>>1);shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(res&1)?~(res>>1):(res>>1);out.push([lng/1e6,lat/1e6])}return out}
const avoidTolls=document.getElementById('avoidTolls'),avoidHighways=document.getElementById('avoidHighways'),avoidFerries=document.getElementById('avoidFerries');
for(const el of [avoidTolls,avoidHighways,avoidFerries]){el.checked=localStorage.getItem(el.id)==='1';el.onchange=()=>localStorage.setItem(el.id,el.checked?'1':'0')}
document.getElementById('routeopts').onclick=e=>{e.stopPropagation();const p=document.getElementById('prefs');p.style.display=p.style.display==='block'?'none':'block'};
document.getElementById('prefs').onclick=e=>e.stopPropagation();
function stopNavigation(){routeSteps=[];stepIndex=0;routeDest=null;routeTotalDistance=0;routeTotalDuration=0;routeStart=null;displayPos=null;follow=true;document.getElementById('trip').style.display='none';document.getElementById('stopnav').style.display='none';document.getElementById('routeopts').style.display='block';document.getElementById('msg').style.display='none';if(map.getLayer('route-line'))map.removeLayer('route-line');if(map.getSource('route'))map.removeSource('route');qEl.value='';if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16,duration:500})}
document.getElementById('stopnav').onclick=stopNavigation;
async function buildRoute(dest){const msg=document.getElementById('msg');if(!last){msg.style.display='block';msg.textContent='Waiting for GPS before routing…';return}msg.style.display='block';msg.textContent='Calculating route…';let rt;if(avoidTolls.checked||avoidHighways.checked||avoidFerries.checked){const req={locations:[{lat:last.lat,lon:last.lng},{lat:dest.lat,lon:dest.lng}],costing:'auto',costing_options:{auto:{use_tolls:avoidTolls.checked?0:0.5,use_highways:avoidHighways.checked?0:1,use_ferry:avoidFerries.checked?0:0.5}},directions_options:{units:'miles'}};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});if(!r.ok)throw new Error('Routing service error '+r.status);const j=await r.json();const leg=j.trip?.legs?.[0];if(!leg)throw new Error('No driving route found');const coords=decodePolyline6(leg.shape);routeSteps=(leg.maneuvers||[]).map(x=>({distance:(x.length||0)*1609.344,maneuver:{instruction:x.instruction||x.verbal_pre_transition_instruction||'Continue',location:coords[x.begin_shape_index||0]}}));rt={distance:(j.trip.summary?.length||0)*1609.344,duration:j.trip.summary?.time||0,geometry:{type:'LineString',coordinates:coords}}}else{const url='https://router.project-osrm.org/route/v1/driving/'+last.lng+','+last.lat+';'+dest.lng+','+dest.lat+'?overview=full&geometries=geojson&steps=true';const r=await fetch(url);if(!r.ok)throw new Error('Routing service error '+r.status);const j=await r.json();if(!j.routes?.[0])throw new Error('No driving route found');rt=j.routes[0];routeSteps=rt.legs.flatMap(l=>l.steps||[])}stepIndex=0;routeTotalDistance=rt.distance;routeTotalDuration=rt.duration;routeStart=last?{...last}:null;document.getElementById('miles').textContent=(rt.distance/1609.344).toFixed(rt.distance<16093?1:0)+' mi';document.getElementById('eta').textContent=Math.max(1,Math.round(rt.duration/60))+' min';document.getElementById('trip').style.display='block';document.getElementById('stopnav').style.display='block';document.getElementById('routeopts').style.display='none';if(map.getSource('route')){map.getSource('route').setData({type:'Feature',geometry:rt.geometry})}else{map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:rt.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#1677ff','line-width':7,'line-opacity':.9}})}follow=false;map.fitBounds(rt.geometry.coordinates.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds()),{padding:70,duration:700});showStep();setTimeout(()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16,duration:700})},1200)}
function gps(p){gpsStarted=true;let c=p.coords,cur={lat:c.latitude,lng:c.longitude};const mphNow=Number.isFinite(c.speed)?Math.max(0,c.speed*2.236936):0;document.getElementById('mph').textContent=Number.isFinite(c.speed)?Math.round(mphNow):'--';updateSpeedLimit(cur.lat,cur.lng);speedWarning(mphNow);if(mphNow>=8){driving=true;slowSince=0;renderLocation()}else if(driving&&mphNow<5){if(!slowSince)slowSince=Date.now();if(Date.now()-slowSince>30000){driving=false;slowSince=0;renderLocation()}}else if(mphNow>=5){slowSince=0;}let h=Number.isFinite(c.heading)?c.heading:null;if(h==null&&last&&c.speed!==0)h=bearing(last,cur);if(h!=null&&(c.speed==null||c.speed>.7))heading=smooth(heading,h);if(!displayPos)displayPos={...cur};else{displayPos.lat+=(cur.lat-displayPos.lat)*.55;displayPos.lng+=(cur.lng-displayPos.lng)*.55}last=cur;if(routeDest&&!routeSteps.length){const d=routeDest;routeDest=null;buildRoute(d).catch(x=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+x.message})}if(!routeSteps.length){const gm=document.getElementById('msg');if(/GPS|location/i.test(gm.textContent))gm.style.display='none';}if(!marker)marker=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'car'}),rotationAlignment:'viewport'}).setLngLat([cur.lng,cur.lat]).addTo(map);else marker.setLngLat([displayPos.lng,displayPos.lat]);if(follow&&routeSteps.length)map.easeTo({center:[displayPos.lng,displayPos.lat],bearing:heading,pitch:50,zoom:Math.max(map.getZoom(),16),duration:280,essential:true});if(routeSteps.length){updateTripProgress(cur,mphNow);const s=routeSteps[Math.min(stepIndex,routeSteps.length-1)],m=s.maneuver?.location;if(m&&distM(cur,{lng:m[0],lat:m[1]})<35&&stepIndex<routeSteps.length-1)stepIndex++;showStep()}updateTown(cur.lat,cur.lng)}
let gpsWatch=null,gpsStarted=false;function err(e){const m=document.getElementById('msg');m.style.display='block';const why=e.code===1?'Location permission is blocked':e.code===2?'Phone cannot get a location fix':'GPS timed out';m.textContent=why+'. Tap here to retry.';m.onclick=startGPS}
function beginWatch(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=navigator.geolocation.watchPosition(gps,e=>{if(!last){gpsStarted=false;err(e)}},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function startGPS(){gpsStarted=true;const m=document.getElementById('msg');m.style.display='block';m.textContent='Getting your location…';m.onclick=null;if(!navigator.geolocation){m.textContent='This browser does not support GPS';gpsStarted=false;return}navigator.geolocation.getCurrentPosition(p=>{gps(p);beginWatch()},e=>{beginWatch();if(!last){m.textContent='Waiting for a GPS fix…';m.onclick=startGPS}},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
document.getElementById('msg').onclick=startGPS;document.getElementById('town').onclick=startGPS;document.getElementById('map').addEventListener('click',()=>{if(!last)startGPS()},{once:true});setTimeout(startGPS,250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!last)startGPS()});
map.on('dragstart',()=>follow=false);document.getElementById('center').onclick=()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16});else startGPS()};
const qEl=document.getElementById('q'),suggestions=document.getElementById('suggestions');let suggestTimer=null,chosenDest=null;
function hideSuggestions(){suggestions.style.display='none';suggestions.innerHTML=''}
async function chooseSuggestion(x){await unlockWifeAudio();chosenDest={lng:+x.lon,lat:+x.lat};qEl.value=x.display_name;hideSuggestions();routeDest=chosenDest;buildRoute(routeDest).catch(err=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+err.message})}
qEl.addEventListener('input',()=>{chosenDest=null;clearTimeout(suggestTimer);const q=qEl.value.trim();if(q.length<3){hideSuggestions();return}suggestTimer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&addressdetails=1&limit=6&q='+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();suggestions.innerHTML='';j.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.textContent=x.display_name;d.onclick=()=>chooseSuggestion(x);suggestions.appendChild(d)});suggestions.style.display=j.length?'block':'none'}catch(e){hideSuggestions()}},350)});
document.addEventListener('click',e=>{if(e.target!==qEl&&!suggestions.contains(e.target))hideSuggestions();document.getElementById('prefs').style.display='none'});
document.getElementById('search').onsubmit=async e=>{e.preventDefault();await unlockWifeAudio();let q=document.getElementById('q').value.trim(),m=document.getElementById('msg');if(!q)return;m.style.display='block';m.textContent='Finding destination…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&q='+encodeURIComponent(q));if(!r.ok)throw new Error('Address search error '+r.status);let j=await r.json();if(!j.length)throw new Error('Destination not found');routeDest={lng:+j[0].lon,lat:+j[0].lat};await buildRoute(routeDest)}catch(x){m.style.display='block';m.textContent='Directions error: '+x.message}};
