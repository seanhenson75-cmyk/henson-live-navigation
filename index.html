<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Henson Live Navigation</title>
<!-- deployment refresh: heading-up navigation -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
<style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,sans-serif}body{background:#071019}.brand{position:absolute;z-index:5;top:8px;left:50%;transform:translateX(-50%);background:#050607e8;color:#fff;border-radius:12px;padding:6px 14px;text-align:center;pointer-events:none}.brand b{letter-spacing:3px}.brand small{display:block;color:#ffc400;letter-spacing:3px;font-size:9px;font-weight:700}.search{position:absolute;z-index:5;top:52px;left:10px;right:10px;display:flex;gap:6px}.search input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;font-size:16px;box-shadow:0 2px 8px #0005}.suggestions{position:absolute;z-index:9;top:98px;left:10px;right:74px;background:#fff;border-radius:10px;box-shadow:0 4px 14px #0005;overflow:hidden;display:none;max-height:240px;overflow-y:auto}.suggestion{padding:11px 12px;border-bottom:1px solid #ddd;color:#111;font-size:14px;cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion:active{background:#eee}.search button,.center{border:0;border-radius:10px;background:#12a84a;color:#fff;font-weight:800;padding:0 15px}.speed{position:absolute;z-index:5;left:12px;bottom:22px;background:#071019e8;color:#fff;border:1px solid #ffffff30;border-radius:14px;padding:7px 12px;text-align:center;min-width:72px}.speed b{display:block;font-size:27px;line-height:27px}.speed small{font-size:10px;font-weight:800;letter-spacing:1px}.town{position:absolute;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);background:#071019e8;color:#fff;border:1px solid #ffffff30;border-radius:18px;padding:7px 13px;font-weight:700;white-space:nowrap}.center{position:absolute;z-index:5;right:12px;bottom:22px;width:48px;height:48px;padding:0;border-radius:50%;font-size:20px}.car{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:28px solid #1677ff;filter:drop-shadow(0 2px 2px #000);transform:translate(-12px,-14px)}.msg{position:absolute;z-index:6;top:100px;left:10px;background:#071019e8;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;max-width:240px}.theme{position:absolute;z-index:7;right:10px;top:8px;background:#071019e8;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:7px 8px;font-weight:700}.theme select{background:#111;color:#fff;border:0;font-weight:700}body.light .brand,body.light .speed,body.light .town,body.light .msg,body.light .theme{background:#fffffff0;color:#111;border-color:#0002}body.light .brand small{color:#8a6500}body.light .theme select{background:#fff;color:#111}
.trip{position:absolute;z-index:7;right:12px;bottom:82px;background:#071019e8;color:#fff;border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;font-weight:800;display:none}.trip span+span{margin-left:12px}body.light .trip{background:#fffffff0;color:#111;border-color:#0002}</style></head>
<body><div id="map"></div><label class="theme">☾ <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><div class="brand"><b>HENSON</b><small>LIVE NAVIGATION</small></div>
<form class="search" id="search"><input id="q" placeholder="Where to?"><button>GO</button></form><div class="suggestions" id="suggestions"></div>
<div class="speed"><b id="mph">--</b><small>MPH</small></div><div class="trip" id="trip"><span id="miles">-- mi</span><span id="eta">-- min</span></div><div class="town" id="town">Waiting for GPS…</div><button class="center" id="center">◎</button><div class="msg" id="msg">Tap here to start GPS</div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const themeSelect=document.getElementById('theme');
function applyTheme(v){localStorage.setItem('nav-theme',v);const dark=v==='dark'||(v==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('light',!dark);document.body.classList.toggle('dark',dark);if(!window.map||!map.isStyleLoaded())return;const style=dark?{version:8,sources:{carto:{type:'raster',tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png','https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png','https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],tileSize:256,attribution:'© OpenStreetMap © CARTO'}},layers:[{id:'carto-dark',type:'raster',source:'carto'}]}:'https://tiles.openfreemap.org/styles/liberty';map.setStyle(style)}
themeSelect.value=localStorage.getItem('nav-theme')||'auto';themeSelect.onchange=()=>applyTheme(themeSelect.value);matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themeSelect.value==='auto')applyTheme('auto')});
const map=new maplibregl.Map({container:'map',style:window._pendingMapStyle||'https://tiles.openfreemap.org/styles/liberty',center:[-82.01,34.5],zoom:11,pitch:45,attributionControl:true});
window.map=map;let marker,last=null,heading=0,follow=true,lastTownAt=0,routeDest=null,routeSteps=[],stepIndex=0;
function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r;return(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/r+360)%360}
function smooth(a,b){let d=((b-a+540)%360)-180;return(a+d*.28+360)%360}
async function updateTown(lat,lng){if(Date.now()-lastTownAt<12000)return;lastTownAt=Date.now();const el=document.getElementById('town');try{const z=[18,16,14,12,10];let town='';for(const zoom of z){const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom='+zoom+'&lat='+lat+'&lon='+lng+'&accept-language=en');if(!r.ok)continue;const x=await r.json(),a=x.address||{};town=a.city||a.town||a.village||a.hamlet||a.locality||a.suburb||a.neighbourhood||'';if(town)break}el.textContent=town||'Town unavailable'}catch(e){el.textContent='Town unavailable'}}
function distM(a,b){const R=6371000,r=Math.PI/180,d1=(b.lat-a.lat)*r,d2=(b.lng-a.lng)*r,x=Math.sin(d1/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function showStep(){if(!routeSteps.length)return;const s=routeSteps[Math.min(stepIndex,routeSteps.length-1)],d=Math.max(0,Math.round(s.distance*3.28084));document.getElementById('msg').style.display='block';document.getElementById('msg').textContent=(s.maneuver?.instruction||'Continue')+' • '+(d>=528?Math.round(d/528)/10+' mi':d+' ft')}
async function buildRoute(dest){const msg=document.getElementById('msg');if(!last){msg.style.display='block';msg.textContent='Waiting for GPS before routing…';return}msg.style.display='block';msg.textContent='Calculating route…';const url='https://router.project-osrm.org/route/v1/driving/'+last.lng+','+last.lat+';'+dest.lng+','+dest.lat+'?overview=full&geometries=geojson&steps=true';const r=await fetch(url);if(!r.ok)throw new Error('Routing service error '+r.status);const j=await r.json();if(!j.routes?.[0])throw new Error('No driving route found');const rt=j.routes[0];routeSteps=rt.legs.flatMap(l=>l.steps||[]);stepIndex=0;document.getElementById('miles').textContent=(rt.distance/1609.344).toFixed(rt.distance<16093?1:0)+' mi';document.getElementById('eta').textContent=Math.max(1,Math.round(rt.duration/60))+' min';document.getElementById('trip').style.display='block';if(map.getSource('route')){map.getSource('route').setData({type:'Feature',geometry:rt.geometry})}else{map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:rt.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#1677ff','line-width':7,'line-opacity':.9}})}follow=false;map.fitBounds(rt.geometry.coordinates.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds()),{padding:70,duration:700});showStep();setTimeout(()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16,duration:700})},1200)}
function gps(p){let c=p.coords,cur={lat:c.latitude,lng:c.longitude};document.getElementById('mph').textContent=Number.isFinite(c.speed)?Math.max(0,Math.round(c.speed*2.236936)):'--';let h=Number.isFinite(c.heading)?c.heading:null;if(h==null&&last&&c.speed!==0)h=bearing(last,cur);if(h!=null&&(c.speed==null||c.speed>.7))heading=smooth(heading,h);last=cur;document.getElementById('town').textContent='GPS LOCKED';if(routeDest&&!routeSteps.length){const d=routeDest;routeDest=null;buildRoute(d).catch(x=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+x.message})}if(!routeSteps.length&&document.getElementById('msg').textContent==='Starting GPS…')document.getElementById('msg').style.display='none';if(!marker)marker=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'car'}),rotationAlignment:'viewport'}).setLngLat([cur.lng,cur.lat]).addTo(map);else marker.setLngLat([cur.lng,cur.lat]);if(follow&&routeSteps.length)map.easeTo({center:[cur.lng,cur.lat],bearing:heading,pitch:50,zoom:Math.max(map.getZoom(),16),duration:700,essential:true});if(routeSteps.length){const s=routeSteps[Math.min(stepIndex,routeSteps.length-1)],m=s.maneuver?.location;if(m&&distM(cur,{lng:m[0],lat:m[1]})<35&&stepIndex<routeSteps.length-1)stepIndex++;showStep()}updateTown(cur.lat,cur.lng)}
let gpsWatch=null,gpsStarted=false;function err(e){const m=document.getElementById('msg');m.style.display='block';const why=e.code===1?'Location permission is blocked':e.code===2?'Phone cannot get a location fix':'GPS timed out';m.textContent=why+'. Tap here to retry.';m.onclick=startGPS}
function beginWatch(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=navigator.geolocation.watchPosition(gps,err,{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
function startGPS(){if(gpsStarted&&gpsWatch!==null)return;gpsStarted=true;const m=document.getElementById('msg');m.style.display='block';m.textContent='Getting your location…';m.onclick=null;if(!navigator.geolocation){m.textContent='This browser does not support GPS';return}navigator.geolocation.getCurrentPosition(p=>{gps(p);beginWatch()},e=>{gpsStarted=false;err(e)},{enableHighAccuracy:false,maximumAge:300000,timeout:10000});setTimeout(()=>{if(!last){gpsStarted=false;beginWatch()}},11000)}
document.getElementById('msg').onclick=startGPS;document.getElementById('town').onclick=startGPS;document.getElementById('map').addEventListener('click',()=>{if(!last)startGPS()},{once:true});setTimeout(startGPS,250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!last)startGPS()});
map.on('dragstart',()=>follow=false);document.getElementById('center').onclick=()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16});else startGPS()};
const qEl=document.getElementById('q'),suggestions=document.getElementById('suggestions');let suggestTimer=null,chosenDest=null;
function hideSuggestions(){suggestions.style.display='none';suggestions.innerHTML=''}
function chooseSuggestion(x){chosenDest={lng:+x.lon,lat:+x.lat};qEl.value=x.display_name;hideSuggestions();routeDest=chosenDest;buildRoute(routeDest).catch(err=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+err.message})}
qEl.addEventListener('input',()=>{chosenDest=null;clearTimeout(suggestTimer);const q=qEl.value.trim();if(q.length<3){hideSuggestions();return}suggestTimer=setTimeout(async()=>{try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&addressdetails=1&limit=6&q='+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();suggestions.innerHTML='';j.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.textContent=x.display_name;d.onclick=()=>chooseSuggestion(x);suggestions.appendChild(d)});suggestions.style.display=j.length?'block':'none'}catch(e){hideSuggestions()}},350)});
document.addEventListener('click',e=>{if(e.target!==qEl&&!suggestions.contains(e.target))hideSuggestions()});
document.getElementById('search').onsubmit=async e=>{e.preventDefault();let q=document.getElementById('q').value.trim(),m=document.getElementById('msg');if(!q)return;m.style.display='block';m.textContent='Finding destination…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&q='+encodeURIComponent(q));if(!r.ok)throw new Error('Address search error '+r.status);let j=await r.json();if(!j.length)throw new Error('Destination not found');routeDest={lng:+j[0].lon,lat:+j[0].lat};await buildRoute(routeDest)}catch(x){m.style.display='block';m.textContent='Directions error: '+x.message}};
</script></body></html>
