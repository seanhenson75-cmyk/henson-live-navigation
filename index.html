const qEl=document.getElementById('q'),suggestions=document.getElementById('suggestions');const poiResults=document.getElementById('poiResults');function poiMessage(t){poiResults.style.display='block';poiResults.textContent=t}function showPoiItems(items){poiResults.innerHTML='';if(!items.length){poiMessage('No matching places found nearby.');return}items.slice(0,25).forEach(p=>{const b=document.createElement('button');b.className='poiItem';const title=document.createElement('span');title.textContent=p.name||p.tags?.name||'Unnamed place';const sub=document.createElement('small');sub.textContent=p.tags?.['addr:street']||p.tags?.amenity||p.tags?.shop||'Tap for directions';b.append(title,sub);b.onclick=async()=>{poiResults.style.display='none';await chooseSuggestion({lat:p.lat??p.center?.lat,lon:p.lon??p.center?.lon,display_name:title.textContent})};poiResults.appendChild(b)});poiResults.style.display='block'}document.getElementById('homeBtn').onclick=async()=>{let home;try{home=JSON.parse(localStorage.getItem('henson-home')||'null')}catch(e){}if(home){const action=confirm('Navigate Home? Press Cancel to change your saved home address.');if(action){await chooseSuggestion(home);return}}const address=prompt('Enter your home street address, city and state:',home?.display_name||'');if(!address)return;try{poiMessage('Finding home address…');const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=1&q='+encodeURIComponent(address));const data=await res.json();if(!data.length)throw Error('Address not found');const x=data[0];if(!confirm('Save this as Home?\\n'+x.display_name))return;localStorage.setItem('henson-home',JSON.stringify({lat:x.lat,lon:x.lon,display_name:x.display_name}));poiResults.style.display='none';await chooseSuggestion(x)}catch(e){poiMessage('Home lookup failed: '+e.message)}};async function loadNearbyPOI(kind){const filter=kind==='fuel'?'["amenity"="fuel"]':'["amenity"~"restaurant|fast_food|cafe"]';const query='[out:json][timeout:20];(node'+filter+'(around:15000,'+last.lat+','+last.lng+');way'+filter+'(around:15000,'+last.lat+','+last.lng+'););out center 100;';const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter'];let error=null;for(const url of endpoints){try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),11000);let response;try{response=await fetch(url,{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.elements))throw Error('Invalid places response');const found=data.elements.filter(p=>p.lat||p.center?.lat);if(!found.length)throw Error('No places returned');return found.sort((a,b)=>distM(last,{lat:a.lat??a.center.lat,lng:a.lon??a.center.lon})-distM(last,{lat:b.lat??b.center.lat,lng:b.lon??b.center.lon}))}catch(e){error=e;console.warn('POI provider failed',url,e)}}if(kind==='fuel'){try{const queries=['gas station','fuel station','Shell','Exxon','BP','QuikTrip'];const all=await Promise.all(queries.map(async q=>{const u='https://photon.komoot.io/api/?limit=20&lat='+last.lat+'&lon='+last.lng+'&q='+encodeURIComponent(q);const resp=await fetch(u);if(!resp.ok)return [];const j=await resp.json();return (j.features||[]).filter(f=>f.geometry?.coordinates?.length===2).map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],tags:{name:f.properties?.name||q,amenity:'fuel', 'addr:street':f.properties?.street||f.properties?.city||''}}))}));const dedup=new Set();const results=all.flat().filter(p=>{const d=distM(last,{lat:p.lat,lng:p.lon});const id=p.lat.toFixed(3)+','+p.lon.toFixed(3);if(d>25000||dedup.has(id))return false;dedup.add(id);return true}).sort((a,b)=>distM(last,{lat:a.lat,lng:a.lon})-distM(last,{lat:b.lat,lng:b.lon}));if(results.length)return results}catch(e){console.warn('Backup gas lookup failed',e)}}throw error||Error('No places service available')}let activePoiRequest=0;document.querySelectorAll('[data-poi]').forEach(btn=>btn.onclick=async()=>{const requestId=++activePoiRequest;const kind=btn.dataset.poi;if(kind==='all'){poiResults.style.display='none';document.getElementById('search').classList.add('expanded');qEl.focus();qEl.placeholder='Search nearby places…';resetSearchIdleTimer();return}if(!last){poiMessage('Waiting for GPS location…');startGPS();return}poiMessage('Finding nearby '+(kind==='fuel'?'gas stations':'restaurants')+'…');try{const items=await loadNearbyPOI(kind);if(requestId===activePoiRequest)showPoiItems(items)}catch(e){if(requestId===activePoiRequest)poiMessage('Nearby places are temporarily unavailable. You can still search by name.')}});let suggestTimer=null,chosenDest=null;
function hideSuggestions(){suggestions.style.display='none';suggestions.innerHTML=''}
async function chooseSuggestion(x){await unlockWifeAudio();chosenDest={lng:+x.lon,lat:+x.lat};qEl.value=x.display_name;hideSuggestions();document.getElementById('search').classList.remove('expanded');routeDest=chosenDest;buildRoute(routeDest).catch(err=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+err.message})}
async function searchPlaces(q){let results=[];if(last){try{const url='https://photon.komoot.io/api/?limit=15&lat='+last.lat+'&lon='+last.lng+'&q='+encodeURIComponent(q);const response=await fetch(url);if(response.ok){const data=await response.json();results=(data.features||[]).filter(f=>f.geometry?.coordinates?.length===2).map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],display_name:[f.properties?.name,f.properties?.street,f.properties?.city||f.properties?.county,f.properties?.state].filter(Boolean).join(', '),kind:f.properties?.type||'',distance:distM(last,{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]})})).filter(x=>x.distance<80000)}}catch(e){console.warn('Local place lookup failed',e)}}try{const local=last?'&viewbox='+[last.lng-.45,last.lat+.35,last.lng+.45,last.lat-.35].join(',')+'&bounded=0':'';const response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&addressdetails=1&limit=15'+local+'&q='+encodeURIComponent(q));if(response.ok){const data=await response.json();results.push(...data.map(x=>({...x,distance:last?distM(last,{lat:+x.lat,lng:+x.lon}):Infinity})))}}catch(e){console.warn('Address lookup failed',e)}const term=q.toLowerCase();const wantsWarehouse=/distribution|warehouse|dc\b/.test(term);results=results.filter(x=>wantsWarehouse||!/distribution center|distribution centre|warehouse/i.test(x.display_name));results.sort((a,b)=>{const an=a.display_name.toLowerCase(),bn=b.display_name.toLowerCase();const exactA=an.split(',')[0].trim()===term?0:1,exactB=bn.split(',')[0].trim()===term?0:1;return exactA-exactB+(a.distance||1e8)-(b.distance||1e8)});return results.filter((x,i,arr)=>arr.findIndex(y=>Math.abs(+x.lat-+y.lat)<.0003&&Math.abs(+x.lon-+y.lon)<.0003)===i).slice(0,12)}function displayPlaceSuggestions(items){suggestions.innerHTML='';items.forEach(x=>{const d=document.createElement('div');d.className='suggestion';d.textContent=x.display_name;d.onclick=()=>chooseSuggestion(x);suggestions.appendChild(d)});suggestions.style.display=items.length?'block':'none'}qEl.addEventListener('input',()=>{chosenDest=null;clearTimeout(suggestTimer);const q=qEl.value.trim();if(q.length<3){hideSuggestions();return}suggestTimer=setTimeout(async()=>{try{const results=await searchPlaces(q);if(qEl.value.trim()===q)displayPlaceSuggestions(results)}catch(e){hideSuggestions()}},450)});
document.addEventListener('click',e=>{if(e.target!==qEl&&!suggestions.contains(e.target))hideSuggestions();if(!poiResults.contains(e.target)&&!e.target.closest('[data-poi]')){activePoiRequest++;poiResults.style.display='none'};document.getElementById('prefs').style.display='none'});
document.getElementById('search').onsubmit=async e=>{e.preventDefault();const q=qEl.value.trim(),m=document.getElementById('msg');if(!q)return;m.style.display='block';m.textContent='Finding nearby destinations…';try{const results=await searchPlaces(q);if(!results.length)throw Error('No matching places found');if(results.length===1){await chooseSuggestion(results[0])}else{document.getElementById('search').classList.add('expanded');displayPlaceSuggestions(results);resetSearchIdleTimer();m.textContent='Select the correct location from the list'}}catch(x){m.textContent='Search error: '+x.message}};
</script></body></html>
