function stopNavigation(){window.activeRouteGeometry=null;routeSteps=[];stepIndex=0;routeDest=null;routeTotalDistance=0;routeTotalDuration=0;routeStart=null;displayPos=null;follow=true;document.getElementById('trip').style.display='none';document.getElementById('stopnav').style.display='none';document.getElementById('routeopts').style.display='block';document.getElementById('msg').style.display='none';if(map.getLayer('route-line'))map.removeLayer('route-line');if(map.getSource('route'))map.removeSource('route');qEl.value='';if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16,duration:500})}

async function buildRoute(dest){const msg=document.getElementById('msg');if(!last){msg.style.display='block';msg.textContent='Waiting for GPS before routing…';return}msg.style.display='block';msg.textContent='Calculating route…';let rt;if(avoidTolls.checked||avoidHighways.checked||avoidFerries.checked){const req={locations:[{lat:last.lat,lon:last.lng},{lat:dest.lat,lon:dest.lng}],costing:'auto',costing_options:{auto:{use_tolls:avoidTolls.checked?0:0.5,use_highways:avoidHighways.checked?0:1,use_ferry:avoidFerries.checked?0:0.5}},directions_options:{units:'miles'}};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});if(!r.ok)throw new Error('Routing service error '+r.status);const j=await r.json();const leg=j.trip?.legs?.[0];if(!leg)throw new Error('No driving route found');const coords=decodePolyline6(leg.shape);routeSteps=(leg.maneuvers||[]).map(x=>({distance:(x.length||0)*1609.344,maneuver:{instruction:x.instruction||x.verbal_pre_transition_instruction||'Continue',location:coords[x.begin_shape_index||0]}}));rt={distance:(j.trip.summary?.length||0)*1609.344,duration:j.trip.summary?.time||0,geometry:{type:'LineString',coordinates:coords}}}else{const url='https://router.project-osrm.org/route/v1/driving/'+last.lng+','+last.lat+';'+dest.lng+','+dest.lat+'?overview=full&geometries=geojson&steps=true';const r=await fetch(url);if(!r.ok)throw new Error('Routing service error '+r.status);const j=await r.json();if(!j.routes?.[0])throw new Error('No driving route found');rt=j.routes[0];routeSteps=rt.legs.flatMap(l=>l.steps||[])}stepIndex=0;routeTotalDistance=rt.distance;routeTotalDuration=rt.duration;routeStart=last?{...last}:null;document.getElementById('miles').textContent=(rt.distance/1609.344).toFixed(rt.distance<16093?1:0)+' mi';document.getElementById('eta').textContent=Math.max(1,Math.round(rt.duration/60))+' min';document.getElementById('trip').style.display='block';document.getElementById('stopnav').style.display='block';document.getElementById('routeopts').style.display='none';window.activeRouteGeometry=rt.geometry;if(map.getSource('route')){map.getSource('route').setData({type:'Feature',geometry:rt.geometry})}else{map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:rt.geometry}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#00ef91','line-width':7,'line-opacity':.95}})}follow=false;map.fitBounds(rt.geometry.coordinates.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds()),{padding:70,duration:700});showStep();setTimeout(()=>{follow=true;if(last)map.easeTo({center:[last.lng,last.lat],bearing:heading,pitch:50,zoom:16,duration:700})},1200)}
function gps(p){gpsStarted=true;let c=p.coords,cur={lat:c.latitude,lng:c.longitude};const mphNow=Number.isFinite(c.speed)?Math.max(0,c.speed*2.236936):0;document.getElementById('mph').textContent=Number.isFinite(c.speed)?Math.round(mphNow):'--';updateSpeedLimit(cur.lat,cur.lng);speedWarning(mphNow);if(mphNow>=8){driving=true;slowSince=0;renderLocation()}else if(driving&&mphNow<5){if(!slowSince)slowSince=Date.now();if(Date.now()-slowSince>30000){driving=false;slowSince=0;renderLocation()}}else if(mphNow>=5){slowSince=0;}let h=Number.isFinite(c.heading)&&c.heading>=0?c.heading:null;const moved=last?distM(last,cur):0;if(moved>=8&&(h===null||mphNow>=7))h=bearing(last,cur);if(h!==null&&mphNow>=5&&(moved>=4||Number.isFinite(c.heading)))heading=smooth(heading,h);if(!displayPos)displayPos={...cur};else{displayPos.lat+=(cur.lat-displayPos.lat)*.55;displayPos.lng+=(cur.lng-displayPos.lng)*.55}last=cur;if(routeDest&&!routeSteps.length){const d=routeDest;routeDest=null;buildRoute(d).catch(x=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+x.message})}if(!routeSteps.length){const gm=document.getElementById('msg');if(/GPS|location/i.test(gm.textContent))gm.style.display='none';}if(!marker)marker=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'car'}),rotationAlignment:'viewport'}).setLngLat([cur.lng,cur.lat]).addTo(map);else marker.setLngLat([displayPos.lng,displayPos.lat]);if(follow){map.jumpTo({center:[displayPos.lng,displayPos.lat],bearing:heading,pitch:55,zoom:Math.max(map.getZoom(),16)});}if(routeSteps.length){updateTripProgress(cur,mphNow);const next=routeSteps[stepIndex+1],m=next?.maneuver?.location;if(m&&distM(cur,{lng:m[0],lat:m[1]})<35&&stepIndex<routeSteps.length-1)stepIndex++;showStep()}updateTown(cur.lat,cur.lng)}
let gpsWatch=null,gpsStarted=false;function err(e){const m=document.getElementById('msg');m.style.display='block';const why=e.code===1?'Location permission is blocked':e.code===2?'Phone cannot get a location fix':'GPS timed out';m.textContent=why+'. Tap here to retry.';m.onclick=startGPS}
function beginWatch(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=navigator.geolocation.watchPosition(gps,e=>{if(!last){gpsStarted=false;err(e)}},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function startGPS(){gpsStarted=true;const m=document.getElementById('msg');m.style.display='block';m.textContent='Getting your location…';m.onclick=null;if(!navigator.geolocation){m.textContent='This browser does not support GPS';gpsStarted=false;return}navigator.geolocation.getCurrentPosition(p=>{gps(p);beginWatch()},e=>{beginWatch();if(!last){m.textContent='Waiting for a GPS fix…';m.onclick=startGPS}},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
document.getElementById('msg').onclick=startGPS;document.getElementById('town').onclick=startGPS;document.getElementById('map').addEventListener('click',()=>{if(!last)startGPS()},{once:true});setTimeout(startGPS,250);

const qEl=document.getElementById('q'),suggestions=document.getElementById('suggestions');const poiResults=document.getElementById('poiResults');function poiMessage(t){poiResults.style.display='block';poiResults.textContent=t}function showPoiItems(items){poiResults.innerHTML='';if(!items.length){poiMessage('No matching places found nearby.');return}items.slice(0,25).forEach(p=>{const b=document.createElement('button');b.className='poiItem';const title=document.createElement('span');title.textContent=p.name||p.tags?.name||'Unnamed place';const sub=document.createElement('small');sub.textContent=p.tags?.['addr:street']||p.tags?.amenity||p.tags?.shop||'Tap for directions';b.append(title,sub);b.onclick=async()=>{poiResults.style.display='none';await chooseSuggestion({lat:p.lat??p.center?.lat,lon:p.lon??p.center?.lon,display_name:title.textContent})};poiResults.appendChild(b)});poiResults.style.display='block'}document.getElementById('homeBtn').onclick=async()=>{let home;try{home=JSON.parse(localStorage.getItem('henson-home')||'null')}catch(e){}if(home){const action=confirm('Navigate Home? Press Cancel to change your saved home address.');if(action){await chooseSuggestion(home);return}}const address=prompt('Enter your home street address, city and state:',home?.display_name||'');if(!address)return;try{poiMessage('Finding home address…');const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=1&q='+encodeURIComponent(address));const data=await res.json();if(!data.length)throw Error('Address not found');const x=data[0];if(!confirm('Save this as Home?\\n'+x.display_name))return;localStorage.setItem('henson-home',JSON.stringify({lat:x.lat,lon:x.lon,display_name:x.display_name}));poiResults.style.display='none';await chooseSuggestion(x)}catch(e){poiMessage('Home lookup failed: '+e.message)}};document.querySelectorAll('[data-poi]').forEach(btn=>btn.onclick=async()=>{if(!last){poiMessage('Waiting for GPS location…');startGPS();return}const kind=btn.dataset.poi;if(kind==='all'){poiResults.style.display='none';qEl.focus();qEl.placeholder='Search stores, hotels, parks, hospitals…';return}poiMessage('Finding nearby '+(kind==='fuel'?'gas stations':'restaurants')+'…');const filter=kind==='fuel'?'["amenity"="fuel"]':'["amenity"="restaurant"]';const query='[out:json][timeout:15];(node'+filter+'(around:12000,'+last.lat+','+last.lng+');way'+filter+'(around:12000,'+last.lat+','+last.lng+'););out center 35;';try{const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!response.ok)throw Error('Places service unavailable');const data=await response.json();showPoiItems((data.elements||[]).filter(p=>p.lat||p.center?.lat).sort((a,b)=>distM(last,{lat:a.lat??a.center.lat,lng:a.lon??a.center.lon})-distM(last,{lat:b.lat??b.center.lat,lng:b.lon??b.center.lon})))}catch(e){poiMessage('Could not load nearby places. Try again shortly.')}});let suggestTimer=null,chosenDest=null;
function hideSuggestions(){suggestions.style.display='none';suggestions.innerHTML=''}
async function chooseSuggestion(x){await unlockWifeAudio();chosenDest={lng:+x.lon,lat:+x.lat};qEl.value=x.display_name;hideSuggestions();routeDest=chosenDest;buildRoute(routeDest).catch(err=>{const m=document.getElementById('msg');m.style.display='block';m.textContent='Directions error: '+err.message})}

document.addEventListener('click',e=>{if(e.target!==qEl&&!suggestions.contains(e.target))hideSuggestions();document.getElementById('prefs').style.display='none'});
document.getElementById('search').onsubmit=async e=>{e.preventDefault();await unlockWifeAudio();let q=document.getElementById('q').value.trim(),m=document.getElementById('msg');if(!q)return;m.style.display='block';m.textContent='Finding destination…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&q='+encodeURIComponent(q));if(!r.ok)throw new Error('Address search error '+r.status);let j=await r.json();if(!j.length)throw new Error('Destination not found');routeDest={lng:+j[0].lon,lat:+j[0].lat};await buildRoute(routeDest)}catch(x){m.style.display='block';m.textContent='Directions error: '+x.message}};
